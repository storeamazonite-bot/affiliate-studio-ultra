name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check app.js
      - run: node --check electron-main.cjs
      - run: node --check ai-creative.mjs
      - run: node --check ai-assets.mjs
      - run: node --check video-engine.mjs
      - run: node --check audio-engine.mjs
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: affiliai-ultra-windows
          path: dist/*Win7-x64.exe
