name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check app.js
      - run: node --check electron-main.cjs
      - run: node --check ai-creative.mjs
      - run: node --check ai-assets.mjs
      - run: node --check video-engine.mjs
      - run: node --check audio-engine.mjs
      - run: npm run dist
      - name: Smoke test packaged desktop app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*Win7-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows executable was not produced." }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "AffiliAI Ultra exited during startup." }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: affiliai-ultra-windows
          path: dist/*Win7-x64.exe
