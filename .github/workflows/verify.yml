name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check app.js
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: affiliai-ultra-windows
          path: dist/*.exe
